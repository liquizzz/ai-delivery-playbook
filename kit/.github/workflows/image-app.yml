# SPDX-License-Identifier: MIT
# AI Delivery Playbook by Hai Nguyen (github.com/liquizzz/ai-delivery-playbook)
# image-app: builds the product image only when app/ or the shared tokens change, plus every release tag.
#   push to dev      ->  :dev, :dev-<sha>
#   push to staging  ->  :staging, :staging-<sha>   (regression and owner acceptance run on this)
#   tag vX.Y.Z       ->  :vX.Y.Z, :latest           (what you deploy; roll back by running an older tag)
# Deploying the image to your own servers is up to you and is not part of this workflow.
name: image-app

on:
  push:
    branches: [dev, staging]
    paths:
      - "app/**"
      - "packages/tokens/**"
      - "docker/app.Dockerfile"
      - "pnpm-lock.yaml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-app
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
