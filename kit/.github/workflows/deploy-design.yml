# SPDX-License-Identifier: MIT
# AI Delivery Playbook by Hai Nguyen (github.com/liquizzz/ai-delivery-playbook)
# deploy-design: publishes the UI/UX prototype ("staging design" link for the client) from dev,
# only when design/ or the shared tokens change. Pause this workflow when the design is approved.
# Secrets (entered by the owner): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: deploy-design

on:
  push:
    branches: [dev]
    paths:
      - "design/**"
      - "packages/tokens/**"
  workflow_dispatch:

concurrency:
  group: deploy-design
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter design build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy design/dist --project-name=<project>-design --branch=main
