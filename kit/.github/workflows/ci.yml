# Crewbook by Hai Nguyen (github.com/liquizzz/crewbook-build)
# CI: lint, type check, unit tests and build on every PR and every push to dev.
# Until the Lead adds the stack's lint and test steps during setup, it checks that the app image builds.
name: ci

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Setup adds the stack's install, lint, type check, test and build steps here.
      - name: Build the app image
        run: |
          if [ -d app ]; then docker build -f docker/app.Dockerfile -t app-ci .; else echo "No app/ folder yet: nothing to build."; fi
