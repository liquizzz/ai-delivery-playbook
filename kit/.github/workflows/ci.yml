# SPDX-License-Identifier: MIT
# AI Delivery Playbook by Hai Nguyen (github.com/liquizzz/ai-delivery-playbook)
# CI: lint, type check, unit tests and build on every PR and every push to dev.
# Adapt the commands to the project (pnpm workspace assumed).
name: ci

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
