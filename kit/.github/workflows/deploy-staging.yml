# deploy-staging: publishes the product from staging when app/ or the shared tokens change.
# Secrets (entered by the owner): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Replace with your host if not Cloudflare.
name: deploy-staging

on:
  push:
    branches: [staging]
    paths:
      - "app/**"
      - "packages/tokens/**"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter app build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=<project>-staging --branch=main
