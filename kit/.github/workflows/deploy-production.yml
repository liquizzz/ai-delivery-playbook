# deploy-production: deploys what the production branch points at, or (manual run) any tag for a rollback.
# Disabled until go-live (1.0.0): keep the workflow disabled in GitHub (Actions → Disable workflow) until the owner turns it on.
# Manual runs and enabling are owner-approved (role-guard asks before the Lead runs them).
# Secrets (entered by the owner): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: deploy-production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (rollback), e.g. v1.3.2"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter app build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=<project> --branch=main
      - name: Record
        run: echo "Deployed ${{ github.event.inputs.tag || github.sha }} to production" >> "$GITHUB_STEP_SUMMARY"
